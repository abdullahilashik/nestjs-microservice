name: RabbitMQ CI/CD

on:
  push:
    branches: ['kafka']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          version: '20'

      - name: Install dependencies
        run: npm ci

      # - name: Test Tasks app
      #   run: |
      #     cd apps
      #     cd tasks
      #     npm test

      # - name: Test Api-Gateway
      #   run: |
      #     cd apps
      #     cd api-gateway
      #     npm run test

      - name: Build Tasks
        run: npm run build tasks

      - name: Build Api Gateway
        run: npm run build api-gateway

      
  dockerize:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7